<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chalo - Modern Indian Travel Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfcfd;
      color: #1a1a1e;
      overflow-x: hidden;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
    }

    @keyframes pulse-slow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.1);
      }
    }

    .animate-pulse-slow {
      animation: pulse-slow 8s ease-in-out infinite;
    }

    @keyframes route-progress {
      0% {
        transform: translateX(-130%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    .animate-route-progress {
      animation: route-progress 1.8s ease-in-out infinite;
    }

    @keyframes rise-in {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-rise {
      animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes landscape-drift {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(10px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .landscape-drift {
      animation: landscape-drift 9s ease-in-out infinite;
    }

    .landscape-drift-slow {
      animation: landscape-drift 13s ease-in-out infinite reverse;
    }

    @keyframes card-float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .cta-float {
      animation: card-float 6s ease-in-out infinite;
    }

    @keyframes shimmer-sweep {
      0% {
        transform: translateX(-130%) skewX(-20deg);
        opacity: 0;
      }

      35% {
        opacity: 0.45;
      }

      70% {
        opacity: 0.12;
      }

      100% {
        transform: translateX(160%) skewX(-20deg);
        opacity: 0;
      }
    }

    .cta-shimmer {
      background: linear-gradient(100deg,
          transparent 10%,
          rgba(255, 255, 255, 0.5) 48%,
          transparent 82%);
      animation: shimmer-sweep 3.2s ease-in-out infinite;
    }

    @keyframes button-glow {
      0%,
      100% {
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
      }

      50% {
        box-shadow: 0 16px 32px rgba(236, 72, 153, 0.26);
      }
    }

    .cta-button-glow {
      animation: button-glow 3.2s ease-in-out infinite;
    }
  </style>
  <script type="module" src="/index.tsx"></script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
